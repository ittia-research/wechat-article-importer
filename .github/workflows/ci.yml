name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip unzip

      - name: Run checks
        run: npm run check

      - name: Build package
        run: npm run build
